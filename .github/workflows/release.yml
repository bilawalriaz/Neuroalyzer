name: Release

# Releases are driven by the version in Cargo.toml. Every push to main checks
# whether a release tagged v<version> exists; if not, it builds every target
# and publishes that release (creating the tag at the pushed commit). So to
# ship: bump `version` in Cargo.toml in your PR, merge it, done. Pushing a
# v* tag by hand still works, and workflow_dispatch re-runs the check.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NFPM_VERSION: 2.48.0

jobs:
  version:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match Cargo.toml version ${version}"
            exit 1
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will release ${tag}."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux binary is built on 22.04 so it only needs glibc 2.35:
          # it then runs on Ubuntu 22.04+, Fedora 36+ and their derivatives.
          # The .deb and .rpm are built from this one binary.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Install nfpm (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/nfpm.tar.gz" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C /usr/local/bin nfpm
          nfpm --version

      - name: Package Linux artifacts
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: scripts/package-linux.sh "${{ needs.version.outputs.version }}"

      - name: Verify on Ubuntu and Fedora (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: scripts/verify-linux.sh dist

      - name: Package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          archive="neuroalyzer-${TAG}-${TARGET}.tar.gz"
          stage="$(mktemp -d)"
          cp "target/${TARGET}/release/neuroalyzer" README.md LICENSE "$stage/"
          tar -C "$stage" -czf "$archive" neuroalyzer README.md LICENSE
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "neuroalyzer-$env:TAG-$env:TARGET.zip"
          $stage = Join-Path $env:RUNNER_TEMP "stage-$env:TARGET"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "target\$env:TARGET\release\neuroalyzer.exe", "README.md", "LICENSE" -Destination $stage
          Compress-Archive -Path "$stage\*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          [System.IO.File]::WriteAllText("$archive.sha256", "$hash  $archive`n")

      - name: Upload archive (Linux)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Upload archive
        if: matrix.target != 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: neuroalyzer-${{ needs.version.outputs.tag }}-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: release
    needs: [version, build]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Combine checksums
        working-directory: dist
        run: cat *.sha256 > SHA256SUMS.txt
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Neuroalyzer ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS.txt

  verify:
    name: verify published assets
    needs: [version, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download the published Linux assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for attempt in 1 2 3 4 5; do
            if gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --pattern '*x86_64-unknown-linux-gnu.tar.gz' \
              --pattern '*.deb' --pattern '*.rpm' --dir dist; then
              break
            fi
            echo "release assets not ready yet (attempt ${attempt}); retrying"
            sleep 10
          done
          ls -l dist
      - name: Run the published packages on Ubuntu and Fedora
        run: scripts/verify-linux.sh dist
