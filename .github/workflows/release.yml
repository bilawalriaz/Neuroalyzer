name: Release

# Releases are driven by the version in Cargo.toml. Every push to main checks
# whether a release tagged v<version> exists; if not, it builds every target
# and publishes that release (creating the tag at the pushed commit). So to
# ship: bump `version` in Cargo.toml in your PR, merge it, done. Pushing a
# v* tag by hand still works, and workflow_dispatch re-runs the check.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} doesn't match Cargo.toml version ${version}"
            exit 1
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Will release ${tag}."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          archive="sesscrub-${TAG}-${TARGET}.tar.gz"
          stage="$(mktemp -d)"
          cp "target/${TARGET}/release/sesscrub" README.md LICENSE "$stage/"
          tar -C "$stage" -czf "$archive" sesscrub README.md LICENSE
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          $archive = "sesscrub-$env:TAG-$env:TARGET.zip"
          $stage = Join-Path $env:RUNNER_TEMP "stage-$env:TARGET"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Path "target\$env:TARGET\release\sesscrub.exe", "README.md", "LICENSE" -Destination $stage
          Compress-Archive -Path "$stage\*" -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          [System.IO.File]::WriteAllText("$archive.sha256", "$hash  $archive`n")

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.target }}
          path: sesscrub-${{ needs.version.outputs.tag }}-${{ matrix.target }}.*
          if-no-files-found: error

  release:
    name: release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true
      - name: Combine checksums
        working-directory: dist
        run: cat *.sha256 > SHA256SUMS.txt
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: sesscrub ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          make_latest: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt
