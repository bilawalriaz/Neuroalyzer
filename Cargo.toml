[workspace]
members = [".", "crates/fixturegen"]

[package]
name = "sesscrub"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Scrub secrets and PII from local AI coding agent session data"
repository = "https://github.com/bilawalriaz/sesscrub"
readme = "README.md"
rust-version = "1.89"

[features]
default = ["ner"]
ner = ["dep:gline-rs", "dep:orp", "dep:ureq"]

[dependencies]
age = "0.12.1"
aho-corasick = "1.1.5"
anyhow = "1.0.104"
blake3 = "1.8.7"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
console = "0.16.6"
dirs = "7.0.0"
glob = "0.3.4"
hex = "0.4.3"
hmac = "0.13.0"
indicatif = "0.18.6"
memmap2 = "0.9.12"
rand = "0.10.3"
rayon = "1.12.0"
regex = "1.13.1"
rpassword = "7.5.4"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
toml = "1.2.1"
walkdir = "2.5.0"
zeroize = "1.9.1"
zstd = { version = "0.14.3", features = ["zstdmt"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "vendored"] }
gline-rs = { version = "1.1.0", optional = true }
orp = { version = "0.9.2", optional = true }
ureq = { version = "3.5.1", optional = true }

[dev-dependencies]
fixturegen = { path = "crates/fixturegen" }
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
